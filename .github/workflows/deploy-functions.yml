# Sends the store's server code (supabase/functions) to Supabase whenever it changes on main.
# Needs one repository secret: SUPABASE_ACCESS_TOKEN (Supabase -> Account -> Access Tokens).
name: Deploy store functions

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - '.github/workflows/deploy-functions.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy functions
        run: supabase functions deploy --project-ref vdfxyjusmakqnpptniiy --use-api
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
