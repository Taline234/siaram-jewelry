# Old Netlify settings, kept only until the site has moved to Cloudflare Pages (then delete this file).
# The site is plain HTML; the store's server code now runs on Supabase (supabase/functions).
[build]
  publish = "."

# Keep source, database and test files off the public website.
[[redirects]]
  from = "/supabase/*"
  to = "/"
  status = 404
  force = true

[[redirects]]
  from = "/netlify/*"
  to = "/"
  status = 404
  force = true

[[redirects]]
  from = "/tests/*"
  to = "/"
  status = 404
  force = true

[[redirects]]
  from = "/netlify.toml"
  to = "/"
  status = 404
  force = true

[[redirects]]
  from = "/STORE-SETUP.md"
  to = "/"
  status = 404
  force = true

[[redirects]]
  from = "/tools/*"
  to = "/"
  status = 404
  force = true

[[redirects]]
  from = "/HANDOVER.md"
  to = "/"
  status = 404
  force = true

[[redirects]]
  from = "/node_modules/*"
  to = "/"
  status = 404
  force = true

[[redirects]]
  from = "/package.json"
  to = "/"
  status = 404
  force = true

[[redirects]]
  from = "/package-lock.json"
  to = "/"
  status = 404
  force = true

# Unpublished drafts (journal articles, until each is ready) stay in the repository but are never served.
[[redirects]]
  from = "/drafts/*"
  to = "/"
  status = 404
  force = true
